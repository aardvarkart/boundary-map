<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Conference Finder</title>
<meta name="description" content="Find which St. Vincent de Paul conference serves an address.">
<meta name="theme-color" content="#2F4E8C">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Conferences">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<meta name="referrer" content="strict-origin-when-cross-origin">
<style>
:root{
  --paper:#F4F6F9; --surface:#FFFFFF; --ink:#18202E; --muted:#5A6476; --line:#DCE1E9; --soft:#EEF1F6;
  --marian:#2F4E8C; --marian-ink:#FFFFFF; --marian-soft:#E6ECF7; --gold:#B8892B; --danger:#A33A2F;
  --serif:"Source Serif 4", "Iowan Old Style", Georgia, serif;
  --sans:"Public Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r-sm:8px; --r-md:12px; --r-lg:18px;
  --shadow:0 1px 2px rgba(24,32,46,.06), 0 10px 30px rgba(24,32,46,.10);
  --panel-w:400px;
  color-scheme:light dark;
}
@media (prefers-color-scheme:dark){
  :root{
    --paper:#11151C; --surface:#181E27; --ink:#E7EBF2; --muted:#9AA4B5; --line:#2A3240; --soft:#202734;
    --marian:#8EA9DD; --marian-ink:#0E1420; --marian-soft:#223051; --gold:#D4A84A; --danger:#E3887C;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 30px rgba(0,0,0,.35);
  }
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{font:15px/1.5 var(--sans);color:var(--ink);background:var(--paper);-webkit-font-smoothing:antialiased;overflow:hidden}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--marian);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg.i{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

#app{display:grid;grid-template-columns:var(--panel-w) 1fr;height:100%}
#map{height:100%;background:var(--soft);z-index:1}

/* Panel */
#panel{position:relative;z-index:2;display:flex;flex-direction:column;min-height:0;background:var(--surface);border-right:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.handle{display:none}
.brand{display:flex;gap:12px;align-items:center;padding:20px 22px 14px}
.brand .mark{width:38px;height:38px;border-radius:10px;background:var(--marian);display:grid;place-items:center;flex:none}
.brand .mark svg{width:22px;height:22px}
.brand h1{font:600 19px/1.2 var(--serif);margin:0;letter-spacing:-.005em}
.brand p{margin:2px 0 0;color:var(--muted);font-size:13px}
.brand .mode{margin-left:auto;font-size:12px;font-weight:600;color:var(--gold);border:1px solid currentColor;border-radius:999px;padding:2px 9px}

.search{position:relative;padding:0 18px 14px}
.field{display:flex;align-items:center;gap:8px;background:var(--soft);border:1px solid transparent;border-radius:var(--r-md);padding:0 6px 0 12px;height:48px;transition:border-color .15s, background .15s}
.field:focus-within{background:var(--surface);border-color:var(--marian)}
.field svg.i{color:var(--muted)}
.field input{flex:1;min-width:0;border:0;background:none;outline:none;font-size:16px;height:100%}
.field input::-webkit-search-cancel-button{display:none}
.iconbtn{display:grid;place-items:center;width:36px;height:36px;border:0;border-radius:10px;background:none;color:var(--muted)}
.iconbtn:hover{background:var(--line);color:var(--ink)}
.iconbtn.busy svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#suggest{position:absolute;left:18px;right:18px;top:52px;margin:0;padding:6px;list-style:none;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);box-shadow:var(--shadow);z-index:10;max-height:320px;overflow:auto}
#suggest li{padding:9px 10px;border-radius:var(--r-sm);cursor:pointer}
#suggest li[aria-selected="true"],#suggest li:hover{background:var(--soft)}
#suggest .l1{font-weight:500}
#suggest .l2{color:var(--muted);font-size:13px}
#suggest .empty{color:var(--muted);cursor:default}
#suggest .empty:hover{background:none}

.scroll{flex:1;overflow:auto;padding:0 18px 18px;overscroll-behavior:contain}
.section-h{display:flex;align-items:baseline;justify-content:space-between;margin:14px 4px 8px}
.section-h h2{font:600 14px/1.3 var(--sans);margin:0}
.section-h span{color:var(--muted);font-size:13px}

/* Result: the one bold moment */
.result{border-radius:var(--r-lg);background:var(--surface);border:1px solid var(--line);overflow:hidden;margin-bottom:6px;animation:rise .28s ease-out}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.result .where{display:flex;gap:10px;align-items:flex-start;padding:14px 16px;background:var(--soft);font-size:14px;color:var(--muted)}
.result .where b{display:block;color:var(--ink);font-weight:500}
.result .where button{margin-left:auto}
.hit{padding:18px 18px 16px;border-left:5px solid var(--c);}
.hit + .hit{border-top:1px solid var(--line)}
.hit .lead{font-size:13px;color:var(--muted);margin:0 0 4px}
.hit h3{font:600 26px/1.15 var(--serif);margin:0;letter-spacing:-.01em;text-wrap:balance}
.hit .parish{color:var(--muted);margin:4px 0 0}
.hit .notes{margin:12px 0 0;white-space:pre-wrap}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.btn{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:500;text-decoration:none;color:var(--ink);white-space:nowrap}
.btn:hover{background:var(--soft)}
.btn.primary{background:var(--marian);border-color:var(--marian);color:var(--marian-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--danger)}
.btn.ghost{border-color:transparent;background:none}
.btn.full{width:100%;justify-content:center}
.btn:disabled{opacity:.5;cursor:default}
.miss{padding:18px}
.miss h3{font:600 22px/1.2 var(--serif);margin:0}
.miss p{margin:6px 0 0;color:var(--muted)}
.warn{margin:0;padding:10px 18px;background:color-mix(in srgb,var(--gold) 14%,transparent);font-size:13px}

/* Lists */
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;align-items:center;gap:12px;padding:11px 10px;border-radius:var(--r-md);cursor:pointer}
.list li:hover,.list li.on{background:var(--soft)}
.sw{width:14px;height:14px;border-radius:4px;background:var(--c);flex:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
.list .nm{font-weight:500;line-height:1.3}
.list .sub{font-size:13px;color:var(--muted)}
.list .grow{flex:1;min-width:0}
.list .chev{color:var(--muted)}
.emptystate{padding:22px 16px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:var(--r-lg)}
.emptystate h3{font:600 18px/1.3 var(--serif);color:var(--ink);margin:0 0 6px}

/* Admin */
.pubbar{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:var(--r-md);background:var(--soft);margin:4px 0 12px;font-size:14px}
.pubbar.busy{background:color-mix(in srgb,var(--gold) 16%,var(--surface))}
.pubbar .dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.pubbar.busy .dot{background:var(--gold)}
.pubbar .who{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.setupbox{margin:12px 0;padding:14px 16px;border-radius:var(--r-md);background:color-mix(in srgb,var(--gold) 14%,var(--surface));font-size:14px}
.setupbox code{font-size:13px}
.adminrow{display:flex;align-items:center;gap:8px;padding:8px 4px;border-bottom:1px solid var(--line);font-size:14px}
.adminrow span{flex:1;overflow:hidden;text-overflow:ellipsis}
.form .inline{display:flex;gap:8px;margin-top:8px}
.form .inline input{flex:1}
.pubbar .txt{flex:1}
.tools{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:6px}
.tools .btn.primary{grid-column:1/-1;justify-content:center;height:46px}
.tools .btn{justify-content:center}
.form label{display:block;font-size:13px;font-weight:500;margin:14px 0 6px}
.form input,.form textarea{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;font-size:16px;outline:none}
.form input:focus,.form textarea:focus{border-color:var(--marian)}
.form textarea{min-height:80px;resize:vertical}
.form .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.swatches{display:flex;flex-wrap:wrap;gap:8px}
.swatches button{width:32px;height:32px;border-radius:50%;border:0;background:var(--c);box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
.swatches button[aria-pressed="true"]{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--c)}
.formhead{display:flex;align-items:center;gap:6px;margin:6px 0 2px}
.formhead h2{font:600 18px/1.3 var(--serif);margin:0;flex:1}
.formfoot{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap}
details.settings{margin-top:18px;border-top:1px solid var(--line);padding-top:6px}
details.settings summary{cursor:pointer;padding:10px 4px;font-weight:600;font-size:14px;list-style:none;display:flex;justify-content:space-between}
details.settings summary::after{content:"+";color:var(--muted)}
details.settings[open] summary::after{content:"–"}
.hint{font-size:13px;color:var(--muted);margin:6px 0 0}

footer.foot{border-top:1px solid var(--line);padding:10px 18px calc(10px + env(safe-area-inset-bottom));display:flex;align-items:center;justify-content:space-between;font-size:13px;color:var(--muted)}
footer.foot button{border:0;background:none;color:var(--muted);font-weight:500;padding:6px 8px;border-radius:8px;display:inline-flex;gap:6px;align-items:center}
footer.foot button:hover{background:var(--soft);color:var(--ink)}

/* Map chrome */
.leaflet-container{font-family:var(--sans);background:var(--soft)}
.leaflet-tile-pane{filter:saturate(.55) contrast(.95) brightness(1.02)}
@media (prefers-color-scheme:dark){.leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) saturate(.35) brightness(.88) contrast(.9)}}
.pin{filter:drop-shadow(0 3px 4px rgba(0,0,0,.3))}
.leaflet-tooltip.tip{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);font-weight:500;padding:5px 9px}
.leaflet-tooltip.tip::before{display:none}
.leaflet-control-zoom a{background:var(--surface)!important;color:var(--ink)!important;border-color:var(--line)!important}
.leaflet-control-attribution{background:color-mix(in srgb,var(--surface) 85%,transparent)!important;color:var(--muted)!important}
.leaflet-control-attribution a{color:var(--muted)!important}
#banner{position:fixed;z-index:1000;top:calc(14px + env(safe-area-inset-top));left:calc(var(--panel-w) + 50%);transform:translateX(calc(-50% - var(--panel-w)/2));width:min(560px,calc(100vw - var(--panel-w) - 28px));background:var(--ink);color:var(--paper);border-radius:var(--r-md);box-shadow:var(--shadow);padding:12px 12px 12px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
#banner .txt{flex:1 1 200px;font-size:14px}
#banner .btn{height:34px;background:transparent;color:var(--paper);border-color:color-mix(in srgb,var(--paper) 30%,transparent)}
#banner .btn.primary{background:var(--paper);color:var(--ink);border-color:var(--paper)}
#toast{position:fixed;z-index:1100;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--ink);color:var(--paper);padding:11px 16px;border-radius:12px;box-shadow:var(--shadow);font-size:14px;max-width:calc(100vw - 32px);transition:opacity .2s, transform .2s}
#toast.show{opacity:1;transform:translate(-50%,0)}
#toast.err{background:var(--danger);color:#fff}

dialog{border:0;border-radius:var(--r-lg);padding:0;width:min(440px,calc(100vw - 32px));background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
dialog::backdrop{background:rgba(10,14,22,.45)}
dialog .db{padding:22px 22px 8px}
dialog h2{font:600 21px/1.25 var(--serif);margin:0 0 8px}
dialog p{margin:0 0 10px;color:var(--muted)}
dialog .df{display:flex;justify-content:flex-end;gap:8px;padding:12px 22px 20px}
dialog .form label:first-child{margin-top:4px}
dialog a{color:var(--marian)}

/* Mobile: bottom sheet */
@media (max-width:760px){
  #app{display:block}
  #map{position:fixed;inset:0}
  #panel{position:fixed;left:0;right:0;bottom:0;border-right:0;border-radius:20px 20px 0 0;box-shadow:0 -6px 30px rgba(10,14,22,.18);padding-top:0;height:var(--h);transition:height .28s cubic-bezier(.2,.8,.2,1)}
  #panel[data-sheet="peek"]{--h:calc(142px + env(safe-area-inset-bottom))}
  #panel[data-sheet="half"]{--h:56%}
  #panel[data-sheet="full"]{--h:calc(100% - 52px - env(safe-area-inset-top))}
  #panel.dragging{transition:none}
  #sheetHead{touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
  .handle{display:block;padding:8px 0 2px}
  .handle span{display:block;margin:0 auto;width:40px;height:5px;border-radius:3px;background:var(--line)}
  .brand{padding:6px 18px 10px}
  .brand .mark{width:32px;height:32px;border-radius:9px}
  .brand h1{font-size:17px}
  .brand p{display:none}
  #panel[data-sheet="peek"] .scroll,#panel[data-sheet="peek"] footer.foot{visibility:hidden}
  #banner{left:50%;transform:translateX(-50%);width:calc(100vw - 24px)}
  .leaflet-top{top:env(safe-area-inset-top)}
  .leaflet-bottom.leaflet-right{bottom:calc(142px + env(safe-area-inset-bottom))}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <aside id="panel" data-sheet="peek" aria-label="Search and results">
    <div id="sheetHead">
    <div class="handle" id="handle" role="button" aria-label="Resize panel" tabindex="0"><span></span></div>
    <header class="brand">
      <div class="mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><path d="M12 13.2l-2.6-2.5a1.6 1.6 0 0 1 2.3-2.3l.3.3.3-.3a1.6 1.6 0 0 1 2.3 2.3z" fill="#fff" stroke="none"/></svg>
      </div>
      <div>
        <h1 id="title">Conference Finder</h1>
        <p id="subtitle">Society of St. Vincent de Paul</p>
      </div>
      <span class="mode" id="modeTag" hidden>Editing</span>
    </header>
    </div>
    <div class="search">
      <label for="q" class="sr">Search an address</label>
      <div class="field">
        <svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/></svg>
        <input id="q" type="search" placeholder="Search an address" autocomplete="off" autocorrect="off" spellcheck="false" enterkeyhint="search" role="combobox" aria-expanded="false" aria-controls="suggest" aria-autocomplete="list">
        <button class="iconbtn" id="clearQ" title="Clear search" aria-label="Clear search" hidden><svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
        <button class="iconbtn" id="locate" title="Use my location" aria-label="Use my location"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.5"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/><circle cx="12" cy="12" r="7.5"/></svg></button>
      </div>
      <ul id="suggest" role="listbox" hidden></ul>
    </div>
    <div class="scroll" id="scroll">
      <div id="viewMode">
        <div id="result"></div>
        <div class="section-h"><h2>Conferences</h2><span id="count"></span></div>
        <ul class="list" id="list"></ul>
      </div>
      <div id="adminMode" hidden></div>
    </div>
    <footer class="foot">
      <span id="footNote">Tap the map to check any spot</span>
      <button id="adminBtn"><svg class="i" viewBox="0 0 24 24"><rect x="5" y="10.5" width="14" height="10" rx="2"/><path d="M8.5 10.5V7.5a3.5 3.5 0 0 1 7 0v3"/></svg><span>Admin</span></button>
    </footer>
  </aside>
  <main id="map" aria-label="Map"></main>
</div>
<div id="banner" hidden></div>
<div id="toast" role="status" aria-live="polite"></div>
<dialog id="dlg"></dialog>
<input type="file" id="fileIn" accept=".geojson,.json,.kml,application/geo+json,application/json,application/vnd.google-earth.kml+xml" hidden>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
"use strict";
/* ───────────────────────── Configuration ─────────────────────────
   Most people never need to touch this. Title, subtitle and starting
   view can all be changed from Admin → Map settings inside the app.  */
const CONFIG = {
  title: "Conference Finder",
  subtitle: "Society of St. Vincent de Paul",
  center: [39.5, -98.35], zoom: 4          // fallback view before any areas exist
};
const LIBS = {

  geomanJs:  "https://cdn.jsdelivr.net/npm/@geoman-io/leaflet-geoman-free@2.20.2/dist/leaflet-geoman.min.js",
  togeojson: "https://cdn.jsdelivr.net/npm/@tmcw/togeojson@7.1.2/dist/togeojson.umd.js"
};
const PALETTE = ["#2F4E8C","#7A3E6B","#2E7D6B","#B8892B","#A2463A","#4F6B2C","#5B5FA8","#8A6A3F","#2C7A9A","#9A4F7F"];
const USE_MILES = /^en-(US|GB|LR|MM)/i.test(navigator.language || "en-US");

/* ───────────────────────── Small helpers ───────────────────────── */
const $ = (s) => document.querySelector(s);
const LS = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
  del(k) { try { localStorage.removeItem(k); } catch {} }
};
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {

const ICON = {
  phone: '<svg class="i" viewBox="0 0 24 24"><path d="M5 4h3.5l1.5 4-2 1.3a11 11 0 0 0 6.7 6.7L16 14l4 1.5V19a1.5 1.5 0 0 1-1.6 1.5A16 16 0 0 1 3.5 5.6 1.5 1.5 0 0 1 5 4z"/></svg>',
  mail: '<svg class="i" viewBox="0 0 24 24"><rect x="3.5" y="5.5" width="17" height="13" rx="2"/><path d="M4 7l8 6 8-6"/></svg>',
  edit: '<svg class="i" viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13.5 6.5l4 4"/></svg>',
  shape: '<svg class="i" viewBox="0 0 24 24"><path d="M5 6l13-2 2 12-11 4z"/><circle cx="5" cy="6" r="1.6" fill="currentColor"/><circle cx="18" cy="4" r="1.6" fill="currentColor"/><circle cx="20" cy="16" r="1.6" fill="currentColor"/><circle cx="9" cy="20" r="1.6" fill="currentColor"/></svg>',
  trash: '<svg class="i" viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>',

function inRing([x, y], ring) {
  let inside = false;
  for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) {
    const [xi, yi] = ring[i], [xj, yj] = ring[j];
    if ((yi > y) !== (yj > y) && x < ((xj - xi) * (y - yi)) / (yj - yi) + xi) inside = !inside;
  }

}

}

  const k = Math.cos(lat * Math.PI / 180), M = 111320;
  let best = Infinity;
  for (const ring of rings) for (let i = 0; i < ring.length - 1; i++) {
    const ax = (ring[i][0] - lng) * k, ay = ring[i][1] - lat, bx = (ring[i + 1][0] - lng) * k, by = ring[i + 1][1] - lat;
    const dx = bx - ax, dy = by - ay, L2 = dx * dx + dy * dy;

/* ───────────────────────── Lookup & results ───────────────────────── */
function checkPoint(latlng, label, sublabel, silent) {
  const pt = [latlng.lng, latlng.lat];
  const hits = features().filter(f => contains(f.geometry, pt));
  let nearest = null, borderline = [];
  if (!hits.length && features().length) {
    nearest = features().map(f => ({ f, d: distanceTo(f.geometry, pt) })).sort((a, b) => a.d - b.d)[0];
  } else if (hits.length === 1) {
    // Pins land on the street centerline. If that's within ~35 m of a neighboring area, the address may be on the dividing street.
    borderline = features().filter(f => f !== hits[0] && distanceTo(f.geometry, pt) < 35);
  }
  state.lastCheck = { latlng, label, sublabel };
  placeMarker(latlng);
  setHighlight(hits.map(f => f.properties.id));
  renderResult({ label, sublabel, hits, nearest, borderline });
  if (silent) return;
  if (!state.admin) setSheet("half");
  const b = L.latLngBounds([latlng]);
  if (map.getZoom() < 14 || !map.getBounds().pad(-.15).contains(latlng)) {
    hits.length === 1 && !isMobile() ? fitTo(state.layers.get(hits[0].properties.id).getBounds().extend(b), 16) : fitTo(b.pad(.002), 16);
  }
}

/* ───────────────────────── Address search ───────────────────────── */

    const done = (fn, v) => { delete window[cb]; el.remove(); clearTimeout(t); fn(v); };

/* ───────────────────────── Mobile bottom sheet ───────────────────────── */
const panel = $("#panel"), handle = $("#sheetHead");
const SHEETS = ["peek", "half", "full"];
function setSheet(s) { if (isMobile()) panel.dataset.sheet = s; }
(function sheetDrag() {
  let startY = 0, startH = 0, dragging = false, moved = false;
  handle.addEventListener("pointerdown", (e) => { dragging = true; moved = false; startY = e.clientY; startH = panel.getBoundingClientRect().height; handle.setPointerCapture(e.pointerId); panel.classList.add("dragging"); });
  handle.addEventListener("pointermove", (e) => {
    if (!dragging) return; const dy = startY - e.clientY; if (Math.abs(dy) > 4) moved = true;
    panel.style.height = Math.max(120, Math.min(innerHeight - 40, startH + dy)) + "px";
  });
  const end = () => {
    if (!dragging) return; dragging = false; panel.classList.remove("dragging");
    if (!moved) { panel.style.height = ""; panel.dataset.sheet = { peek: "half", half: "full", full: "half" }[panel.dataset.sheet] || "half"; return; }
    const hNow = panel.getBoundingClientRect().height, H = innerHeight;
    const targets = { peek: 150, half: H * .56, full: H - 60 };
    const best = Object.entries(targets).sort((a, b) => Math.abs(a[1] - hNow) - Math.abs(b[1] - hNow))[0][0];
    panel.style.height = ""; panel.dataset.sheet = best;
  };
  handle.addEventListener("pointerup", end); handle.addEventListener("pointercancel", end);
  $("#handle").addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); panel.dataset.sheet = SHEETS[(SHEETS.indexOf(panel.dataset.sheet) + 1) % 3]; } });
})();

function featureFromDoc(d) {
  const x = d.data() || {};
  let geometry = null; try { geometry = JSON.parse(x.geom || "null"); } catch {}
  if (!geometry || !/^(Multi)?Polygon$/.test(geometry.type)) return null;
  return { type: "Feature", geometry, properties: {
    id: d.id, name: x.name || "Unnamed area", color: x.color || PALETTE[0], parish: x.parish || "", phone: x.phone || "",
    email: x.email || "", contact: x.contact || "", notes: x.notes || ""
  } };
}
function propsToDoc(p, geometry) {
  const out = { name: p.name || "Unnamed area", color: p.color, parish: p.parish || "", phone: p.phone || "", email: p.email || "", contact: p.contact || "", notes: p.notes || "",
    updatedAt: firebase.firestore.FieldValue.serverTimestamp(), updatedBy: emailOf(state.user) };
  if (geometry) out.geom = JSON.stringify(geometry);
  return out;
}

/* Live subscriptions: everyone sees edits the moment they're saved. */
function subscribe() {
  state.unsub.push(areasCol().onSnapshot((snap) => {
    const first = !state.data.loaded;
    let touched = false;                       // did anything change that the admin panel should show?
    snap.docChanges().forEach((ch) => {
      const id = ch.doc.id;
      if (ch.type === "removed") {
        state.layers.get(id)?.remove(); state.layers.delete(id);
        state.data.features = features().filter(f => f.properties.id !== id);
        if (state.selected === id) { state.selected = null; stopShapeEdit(); }
        touched = true; return;
      }
      const nf = featureFromDoc(ch.doc); if (!nf) return;
      const existing = byId(id);
      if (!existing) { features().push(nf); addLayer(nf); touched = true; return; }
      const sameProps = JSON.stringify(existing.properties) === JSON.stringify(nf.properties);
      const sameGeom = JSON.stringify(existing.geometry) === JSON.stringify(nf.geometry);
      if (sameProps && sameGeom) return;       // our own write coming back, or nothing new
      const editingForm = state.admin && state.selected === id && ch.doc.metadata.hasPendingWrites;
      if (!sameProps && !editingForm) { Object.assign(existing.properties, nf.properties); touched = true; }
      if (!sameGeom && state.editingShape !== id) {
        existing.geometry = nf.geometry;
        state.layers.get(id)?.remove(); state.layers.delete(id); addLayer(existing);
        if (highlighted.has(id)) setHighlight([...highlighted]);
      } else if (!sameProps) state.layers.get(id)?.setStyle(style(existing, highlighted.has(id)));
    });
    state.data.loaded = true;
    renderList();
    if (state.admin && touched) renderAdmin();
    if (first) startView();
    if (state.lastCheck && !state.admin) checkPoint(state.lastCheck.latlng, state.lastCheck.label, state.lastCheck.sublabel, true);
  }, (err) => { console.error(err); toast("Couldn't load the map data. Check the Firebase setup and rules.", true); }));
  state.unsub.push(settingsDoc().onSnapshot((d) => {
    const x = d.exists ? d.data() : {};
    const next = Object.assign({ title: CONFIG.title, subtitle: CONFIG.subtitle }, x);
    const same = JSON.stringify(next) === JSON.stringify(state.data.meta);
    const wasSet = !!state.data.meta.view;
    state.data.meta = next;
    renderHeader();
    if (!wasSet && next.view && !state.data.loaded) startView();
    if (state.admin && !same) renderAdmin();
  }));
}

/* Saving helpers: every edit writes straight to Firestore. */
function saveStart() { state.saving++; updateStatus(); }
function saveEnd(err) {
  state.saving = Math.max(0, state.saving - 1); updateStatus();

}

const saveArea = (f, withGeom) => write(areasCol().doc(f.properties.id).set(propsToDoc(f.properties, withGeom ? f.geometry : null), { merge: true }));
const saveAreaQuiet = debounce((id) => { const f = byId(id); f && saveArea(f, false); }, 600);
const saveSettings = debounce(() => write(settingsDoc().set({ title: state.data.meta.title || "", subtitle: state.data.meta.subtitle || "", view: state.data.meta.view || null }, { merge: true })), 600);

  if (!state.editingShape) return;
  const id = state.editingShape, layer = state.layers.get(id);
  if (layer && layer.pm) { layer.pm.disable(); layer.off("pm:edit", onShapeEdit); }
  state.editingShape = null; hideBanner();
  const f = byId(id); if (f && f._geomDirty) { delete f._geomDirty; saveArea(f, true); }
}
async function deleteArea(id) {
  const f = byId(id); if (!f) return;
  if (!await confirmDlg("Delete this area?", `“${f.properties.name}” will be removed for everyone right away.`, "Delete area", true)) return;
  stopShapeEdit();
  state.layers.get(id)?.remove(); state.layers.delete(id);
  state.data.features = features().filter(x => x.properties.id !== id);
  state.selected = null; setHighlight([]); renderList(); renderAdmin();
  write(areasCol().doc(id).delete());
}

function exportFile() {
  const out = { type: "FeatureCollection", meta: state.data.meta, features: features().map(f => ({ type: "Feature", properties: f.properties, geometry: f.geometry })) };
  const blob = new Blob([JSON.stringify(out, null, 1)], { type: "application/geo+json" });
  const a = h("a", { href: URL.createObjectURL(blob), download: "boundaries.geojson" });
  document.body.append(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}
$("#fileIn").addEventListener("change", async (e) => {
  const file = e.target.files[0]; e.target.value = ""; if (!file) return;
  try {
    const text = await file.text();
    let gj;
    if (/\.kml$/i.test(file.name) || /^\s*<\?xml|<kml/i.test(text.slice(0, 200))) {
      await loadScript(LIBS.togeojson);
      gj = toGeoJSON.kml(new DOMParser().parseFromString(text, "text/xml"));
    } else gj = JSON.parse(text);
    const raw = gj.type === "FeatureCollection" ? gj.features : gj.type === "Feature" ? [gj] : [{ type: "Feature", properties: {}, geometry: gj }];
    // Outlines drawn as lines (common in Google My Maps) are closed into areas.
    const lineToPoly = (g) => {
      const rings = g.type === "LineString" ? [g.coordinates] : g.coordinates;
      const ok = rings.map(r => r.map(c => [c[0], c[1]])).filter(r => r.length >= 3).map(r => {
        const [a, b] = [r[0], r[r.length - 1]];
        return (a[0] === b[0] && a[1] === b[1]) ? r : [...r, a];
      });
      if (!ok.length) return null;
      return ok.length === 1 ? { type: "Polygon", coordinates: [ok[0]] } : { type: "MultiPolygon", coordinates: ok.map(r => [r]) };
    };
    let converted = 0;
    const polys = raw.filter(f => f && f.geometry).map(f => {
      if (/^(Multi)?Polygon$/.test(f.geometry.type)) return f;
      if (/^(Multi)?LineString$/.test(f.geometry.type)) { const g = lineToPoly(f.geometry); if (g) { converted++; return { type: "Feature", properties: f.properties || {}, geometry: g }; } }
      return null;
    }).filter(Boolean);
    if (!polys.length) return toast("No area shapes were found in that file. It needs shapes or outlines, not just points.", true);
    if (!await confirmDlg("Import " + polys.length + " area" + (polys.length === 1 ? "" : "s") + "?", (converted ? converted + " of them were drawn as outlines and will be closed into areas. " : "") + "They'll be added to the map for everyone right away. You can rename or delete them afterwards.", "Import")) return;
    const start = features().length;
    const batch = FB.db.batch();
    for (const [i, f] of polys.entries()) {
      const pr = f.properties || {};
      const nf = { type: "Feature", geometry: roundGeom(f.geometry), properties: {
        id: areasCol().doc().id, name: String(pr.name || pr.Name || pr.NAME || pr.title || pr.PARISH || pr.parish || "Imported area " + (i + 1)),
        color: /^#[0-9a-f]{6}$/i.test(pr.color || "") ? pr.color : PALETTE[(start + i) % PALETTE.length],
        parish: pr.parish || "", phone: pr.phone || "", email: pr.email || "", contact: pr.contact || "", notes: typeof (pr.notes || pr.description) === "string" ? (pr.notes || pr.description) : ""
      } };
      features().push(nf); addLayer(nf);
      batch.set(areasCol().doc(nf.properties.id), propsToDoc(nf.properties, nf.geometry));
    }
    renderList(); renderAdmin(); fitTo(allBounds(), 14);
    await write(batch.commit());
    toast(`Added ${polys.length} area${polys.length === 1 ? "" : "s"}. Review the names and details.`);
  } catch (err) { console.error(err); toast("That file couldn't be read. Use a .geojson, .json or .kml file.", true); }
});

/* ───────────────────────── Start ───────────────────────── */
(function init() {
  state.data = normalize(null);
  renderHeader(); renderList();
  if (!fbInit()) {
    map.setView(CONFIG.center, CONFIG.zoom);
    $("#result").replaceChildren(h("div", { class: "setupbox" }, h("b", {}, "One step left: connect Firebase."), " Open ", h("code", {}, "firebase-config.js"), " and paste in your project's config. SETUP.md walks through it."));
  } else {
    subscribe();
    FB.auth.onAuthStateChanged(refreshAdminStatus);
    FB.auth.getRedirectResult().catch(() => {});
    setTimeout(() => { if (!state.data.loaded) startView(); }, 2500);   // offline or slow: don't leave a blank map
  }
  const addr = new URLSearchParams(location.search).get("address");
  if (addr) { q.value = addr; $("#clearQ").hidden = false; submitSearch(); }
  if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});
})();
</script>
